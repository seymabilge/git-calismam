<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kutu Modeli - Margin</title>
  <style>
    
    .container1, .container2 {
      width: 100%;
      float: left;
      margin-bottom: 12px; 
    }

    
    .kutu, .kutu2, .kutu3, .kutu4 {
      height: 150px;
      width: 200px;
      float: left;
    }

   
    .kutu {
      background-color: aqua;
      margin-right: 12px; 
    }

    .kutu2 {
      background-color: rgb(137, 137, 237);
    }

    
    .kutu3 {
      background-color: rgb(194, 255, 102);
      margin-right: 12px;
    }

    .kutu4 {
      background-color: rgb(195, 167, 221);
    }
  </style>
</head>
<body>

 
  <div class="container1">
    <div class="kutu">
      1. Kutu: Ön uç web geliştirme derslerinde HTML sayfa yapısını oluşturur.
    </div>
    <div class="kutu2">
      2. Kutu: Kutu modeli; genişlik, yükseklik, iç ve dış boşlukları kapsar.
    </div>
  </div>

  
  <div class="container2">
    <div class="kutu3">
      3. Kutu: Margin özelliği elemanların dışındaki boşlukları ayarlar.
    </div>
    <div class="kutu4">
      4. Kutu: Float özelliği yan yana dizilim için kullanılır.
    </div>
  </div>

</body>
</html>
